name: CI

# The RPC control plane spawns real processes and reads real signals: the
# suite must pass on the three platforms we support (Windows included).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows is not in this matrix yet: the pre-existing child/policy
      # path suite is POSIX-only. The new RPC worker has a taskkill path,
      # but the package as a whole does not claim Windows until that suite
      # is portable. pi-jobd/pi-mesh keep Windows in their matrices.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
